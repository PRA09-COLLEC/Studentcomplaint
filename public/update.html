<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student | Scholaro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🎓 Scholaro</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert</a>
        <a href="update.html">Update</a>
        <a href="list.html">List</a>
        <a href="listone.html">List One</a>
        <a href="delete.html">Delete</a>
    </nav>
</header>

<main class="container">

    <h1>✏️ Update Student</h1>

    <section class="panel">
        <h2>Select Student Roll Number</h2>
        <div id="rollNumbers" class="roll-container">
            Loading roll numbers...
        </div>
    </section>

    <section class="panel form-panel">

        <form id="updateForm">

            <label for="sno">Roll Number</label>
            <input type="number" id="sno" required>

            <button type="button" class="btn secondary" id="loadStudentBtn">
                Load Student
            </button>

            <label for="name">Student Name</label>
            <input type="text" id="name" required>

            <label for="studentClass">Class</label>
            <input type="text" id="studentClass" required>

            <label for="total">Total Marks</label>
            <input type="number" id="total" min="0">

            <label for="age">Age</label>
            <input type="number" id="age" min="1">

            <label for="phnno">Phone Number</label>
            <input type="tel" id="phnno">

            <button type="submit" class="btn">Update Student</button>

        </form>

        <div id="formNotice" class="notice" hidden></div>
    </section>

</main>

<footer>Scholaro Student Management System</footer>

<script src="script.js"></script>
</body>
</html>
